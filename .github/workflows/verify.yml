name: Verify source

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Check first-run image handling in Windows PowerShell 5.1
        shell: powershell
        run: ./test/start-windows.ps1

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run evaluate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Build and identify container
        run: |
          docker build --build-arg SOURCE_REVISION="$GITHUB_SHA" -t "c-companion:$GITHUB_SHA" .
          actual="$(docker image inspect "c-companion:$GITHUB_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$actual" = "$GITHUB_SHA"
      - name: Record source manifest
        run: node ops/release-manifest.mjs > release-manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-manifest
          path: release-manifest.json
